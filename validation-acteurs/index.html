<style>
  /* Outil interne : une colonne, sections empilées, barre d'enregistrement fixe en bas. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--color-bg-alt); color: var(--color-text); font: var(--fw-regular) var(--fs-body)/var(--lh-body) var(--font-body); }
  .wrap { max-width: 980px; margin: 0 auto; padding: var(--space-7) var(--space-4) 140px; display: grid; gap: var(--space-7); }
  h1, h2, h3 { font-family: var(--font-display); color: var(--color-text-strong); margin: 0; text-wrap: balance; }
  h1 { font-size: clamp(28px, 5vw, 40px); font-weight: var(--fw-black); line-height: 1.1; letter-spacing: -0.02em; }
  h2 { font-size: 24px; font-weight: var(--fw-bold); letter-spacing: -0.01em; }
  p { margin: 0; max-width: 68ch; }
  .eyebrow { font: var(--fw-bold) var(--fs-xs)/1 var(--font-display); letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-accent); }
  .logo { height: 44px; width: auto; display: block; }

  header { display: grid; gap: var(--space-4); }
  .how { display: grid; gap: var(--space-3); padding: var(--space-5); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-lg); }
  .how ol { margin: 0; padding-left: 1.3em; list-style: decimal; display: grid; gap: var(--space-2); }

  /* Sommaire / avancement */
  .summary { display: grid; gap: var(--space-2); margin: 0; padding: 0; list-style: none; }
  .summary a { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4);
    background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-md); color: inherit; text-decoration: none; }
  .summary a:hover { border-color: var(--color-accent); }
  .summary .name { font-weight: var(--fw-semibold); }
  .meter { display: flex; align-items: center; gap: var(--space-3); font-variant-numeric: tabular-nums; font-size: var(--fs-small); color: var(--color-text-muted); white-space: nowrap; }
  .bar { width: 120px; height: 6px; border-radius: var(--radius-full); background: var(--color-border); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--color-accent); width: 0; transition: width var(--transition-base); }
  .done .bar i { background: var(--color-success); }
  .done .count { color: var(--color-success); font-weight: var(--fw-semibold); }

  /* Sections */
  section.block { display: grid; gap: var(--space-4); scroll-margin-top: var(--space-5); }
  .block-head { display: grid; gap: var(--space-2); }
  .block-head .row1 { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: var(--space-3); }
  .rows { display: grid; background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-lg); overflow: hidden; }
  .item { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: var(--space-5); padding: var(--space-5); border-top: 1px solid var(--color-border); }
  .item:first-child { border-top: 0; }
  .item.is-done { background: #F4FAF5; }
  .who { display: grid; gap: var(--space-1); align-content: start; min-width: 0; }
  .who h3 { font-size: 17px; font-weight: var(--fw-bold); display: flex; gap: var(--space-2); align-items: center; }
  .who a { font-size: var(--fs-small); color: var(--color-accent); }
  .current { font-size: var(--fs-small); color: var(--color-text-muted); overflow-wrap: anywhere; white-space: pre-line; }
  .current b { color: var(--color-text); font-weight: var(--fw-medium); }

  .answer { display: grid; gap: var(--space-3); align-content: start; min-width: 0; }
  label.lbl { font-size: var(--fs-small); font-weight: var(--fw-semibold); }
  input[type=text], input[type=email], input[type=tel], input[type=url], textarea {

  .pair > div { display: grid; gap: var(--space-1); }
  .none { display: flex; gap: var(--space-2); align-items: center; font-size: var(--fs-small); color: var(--color-text-muted); width: fit-content; cursor: pointer; }
  .choices { display: grid; gap: var(--space-2); }
  .choice { display: flex; gap: var(--space-3); align-items: flex-start; padding: var(--space-3); border: 1px solid var(--color-border); border-radius: var(--radius-md); cursor: pointer; }

  .facts dt { color: var(--color-text-muted); } .facts dd { margin: 0; overflow-wrap: anywhere; }
  .question { font-weight: var(--fw-semibold); }

  /* Barre d'enregistrement */
  .savebar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--color-text-strong); color: #fff;
    padding: var(--space-3) var(--space-4) calc(var(--space-3) + env(safe-area-inset-bottom, 0px)); }
  .savebar .in { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3) var(--space-5); }
  .savebar .total { font-family: var(--font-display); font-weight: var(--fw-bold); font-variant-numeric: tabular-nums; }
  .savebar .status { font-size: var(--fs-small); color: #C9C4BD; flex: 1; min-width: 180px; }
  .savebar .status.err { color: #FFB4AE; }
  .btn { font: var(--fw-semibold) 15px/1 var(--font-body); padding: 12px 22px; border-radius: var(--radius-full); border: 0; cursor: pointer; background: var(--color-accent); color: #fff; }
  .btn:hover { background: var(--color-accent-hover); }
  .btn:disabled { opacity: .5; cursor: default; }

  .wrap, #content, section.block, .rows { grid-template-columns: minmax(0, 1fr); }
  #content { display: grid; gap: var(--space-7); }
  .question, .choice span, .current, .sug { overflow-wrap: anywhere; }
  .sug { display: grid; gap: var(--space-1); padding: var(--space-3); background: #FFF7E6; border: 1px solid #EBCB8B; border-radius: var(--radius-md); font-size: var(--fs-small); }
  .sug .tag { font-weight: var(--fw-semibold); color: #7A4F00; }
  .sug .val { color: var(--color-text); white-space: pre-line; }
  .sug a { color: var(--color-accent); overflow-wrap: anywhere; }
  .item.to-check { background: #FFFCF4; }
  .to-check .check { border-color: var(--color-warning); }
  .meter .pend { color: #7A4F00; font-weight: var(--fw-semibold); }
  .sug[hidden] { display: none; }
  .gate { padding: var(--space-6); background: var(--color-bg); border: 1px solid var(--color-border); border-radius: var(--radius-lg); display: grid; gap: var(--space-3); }

  @media (max-width: 720px) {
    .item { grid-template-columns: 1fr; gap: var(--space-3); padding: var(--space-4); }
    .bar { width: 64px; }
    .summary a { grid-template-columns: minmax(0, 1fr); gap: var(--space-2); }
    .meter { white-space: normal; flex-wrap: wrap; }
    .pair { grid-template-columns: 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

agram.com/unitihabitat."}}, {"id": "site:west-wave-tatoo-shop", "kind": "text", "input": "url", "actors": [{"slug": "west-wave-tatoo-shop", "name": "WEST WAVE TATOO SHOP"}], "current": "Aucun site", "placeholder": "https://"}]}, {"id": "descriptions", "title": "Descriptions à enrichir", "intro": "Ces textes de présentation sont trop courts, ou en anglais pour la Nouvelle Compagnie des Arts Graphiques. Trois à cinq phrases suffisent : activité, spécialités, ce qui distingue l’acteur.", "items": [{"id": "description:al-mounia", "kind": "textarea", "actors": [{"slug": "al-mounia", "name": "AL MOUNIA"}], "current": "Restaurant marocain", "placeholder": "Présentation de l’activité…", "suggest": {"value": "AL MOUNIA prépare des spécialités marocaines à emporter depuis BIARRITZ Activités, au 25 allée du Moura, au VILLAGE Iraty-BIARRITZ. L'ancienne équipe de la Mamounia y propose couscous, tajines et grillades, préparés sur place avec des produits frais. La carte compte aussi des entrées comme la pastilla, les bricks ou la salade mechouia, et un couscous bowl servi uniquement le midi. Les commandes se passent par téléphone et se retirent à partir de 11h45 le midi et de 18h45 le soir ; des couscoussiers sont disponibles pour les commandes plus importantes.", "source": "https://almounia-biarritz.com", "confiance": "haute", "note": "Le site revendique « Depuis 1987 » et « plus de 30 ans d'expérience », non repris. Aucun email sur le site."}}, {"id": "description:ds-wash", "kind": "textarea", "actors": [{"slug": "ds-wash", "name": "ANTONIO WASH"}], "current": "Station de lavage", "placeholder": "Présentation de l’activité…"}, {"id": "description:astra", "kind": "textarea", "actors": [{"slug": "astra", "name": "ASTRA Bar Audiophile"}], "current": "BAR", "placeholder": "Présentation de l’activité…", "suggest": {"value": "ASTRA est un listening bar et mini club installé au VILLAGE Iraty-BIARRITZ, au 2 rue des Mésanges. Le lieu accueille des soirées autour des musiques électroniques (deep house, électro, trance), avec des DJ invités et des résidences. L'organisateur met en avant une attention particulière portée à l'acoustique de la salle et au système de diffusion du son.", "source": "https://www.facebook.com/p/ASTRA-61564577793248/ ; https://ra.co/events/2441353 ; https://ra.co/events/2324340", "confiance": "faible", "note": "Sources lues uniquement via extraits de moteur de recherche : intro Facebook (« Listening bar | Mini club ») et fiches d'événements Resident Advisor (ra.co renvoie 403 en lecture directe). La phrase sur l'acoustique vient de la présentation du promoteur sur RA (« special attention put on room acoustics and soundsystem setup ») : à retirer si le client préfère ne garder que du vérifié en direct. Le terme « audiophile » du nom actuel n'apparaît dans aucune source. NB : l'activité déclarée au registre est « Evénements, traiteur, débit de boisson non alcoolisée » (societe.com)."}}, {"id": "description:atlantic-service", "kind": "textarea", "actors": [{"slug": "atlantic-service", "name": "ATLANTIC SERVICE"}], "current": "Entreprise de nettoyage et entretien des locaux", "placeholder": "Présentation de l’activité…", "suggest": {"value": "ATLANTIC SERVICE est une entreprise de nettoyage dont l'agence de BIARRITZ est installée au VILLAGE Iraty-BIARRITZ, dans la Halle DARLA. Elle intervient auprès des particuliers comme des professionnels pour le nettoyage de bureaux, de commerces, d'immeubles, de locaux industriels, de parkings et d'établissements de santé, d'hôtellerie et de restauration. Elle assure aussi le lavage de vitrages, y compris en hauteur sur les grands bâtiments, avec du personnel titulaire des CACES pour nacelles. L'entreprise intervient en Gironde, dans les Landes et dans les Pyrénées-Atlantiques.", "source": "http://www.atlantic-service.fr", "confiance": "haute", "note": "Faits tirés du site officiel ; l'implantation Halle DARLA vient de l'annuaire des entreprises. Le site donne pour BIARRITZ le 05.59.47.96.39 (conforme) mais l'email contact@atlantic-service.fr (et non atlantic.service@wanadoo.fr)."}}, {"id": "description:avad", "kind": "textarea", "actors": [{"slug": "avad", "name": "AVAD"}], "current": "Service de prestation à domicile", "placeholder": "Présentation de l’activité…", "suggest": {"value": "AVAD est un prestataire de santé à domicile, branche domicile de la FGLMR, association reconnue d'utilité publique. Son agence de la Côte basque et des Landes est installée allée du Moura à BIARRITZ. AVAD prend en charge à domicile l'assistance respiratoire (oxygénothérapie, ventilation), le traitement des apnées du sommeil par pression positive continue, la perfusion et la nutrition entérale. Ses équipes assurent la fourniture, l'installation, la maintenance et le dépannage des appareils, ainsi que le suivi du traitement en lien avec les équipes soignantes. Elles réunissent infirmiers, kinésithérapeutes, pharmaciens, diététiciens et techniciens.", "source": "https://avad-assistance.com/domaineactivite.html ; https://avad-assistance.com/assistanceresp.html ; https://avad-assistance.com/contact.html", "confiance": "haute", "note": "Le site est en http://www.avad-assistance.com (redirige vers https://avad-assistance.com/). Aucun horaire publié sur le site, aucun trouvé ailleurs."}}, {"id": "description:axe-eco-energie", "kind": "textarea", "actors": [{"slug": "axe-eco-energie", "name": "AXE ECO ENERGIE"}], "current": "Etude des énergies renouvables", "placeholder": "Présentation de l’activité…", "suggest": {"value": "AXE ECO ENERGIE est une entreprise spécialisée dans les solutions énergétiques durables dans le Sud-Ouest. Elle installe des panneaux photovoltaïques, des pompes à chaleur, des systèmes de climatisation et des chauffe-eau thermodynamiques.", "source": "https://axe-ecoenergie.fr/", "confiance": "faible", "note": "Contenu sourcé, mais l'établissement de BIARRITZ est fermé au registre (voir address)."}}, {"id": "description:b-ocean", "kind": "textarea", "actors": [{"slug": "b-ocean", "name": "B.Ocean"}], "current": "Charpentier", "placeholder": "Présentation de l’activité…"}, {"id": "description:beauty-success", "kind": "textarea", "actors": [{"slug": "beauty-success", "name": "BEAUTY SUCCES"}], "current": "Institut de beauté", "placeholder": "Présentation de l’activité…", "suggest": {"value": "L'institut Beauty Success de BIARRITZ Iraty est installé au 6 rue des Mésanges, dans la Halle DALBA du VILLAGE Iraty. Il propose des soins du visage, des soins du corps, des massages et des épilations, ainsi que des manucures. L'institut dispose de deux cabines de soins et d'une carte de soins détaillée avec ses tarifs. Les rendez-vous se prennent en ligne via Planity, et des cartes cadeaux sont proposées.", "source": "https://www.beautysuccess.fr/nos-points-de-vente/biarritz/1350/", "confiance": "haute", "note": ""}}, {"id": "description:biarritz-training", "kind": "textarea", "actors": [{"slug": "biarritz-training", "name": "BEST TRAINING à BIARRITZ TRAINING"}], "current": "Entrainement de sport", "placeholder": "Présentation de l’activité…", "suggest": {"value": "BIARRITZ TRAINING est une salle de sport installée 18 rue des Mésanges à BIARRITZ, qui propose des cours collectifs encadrés par une équipe de coachs. Son planning réunit du HYROX (HYROX Engine, HYROX Power), du WOD, du Cross Training, du Lift, du Cycling et du yoga, en Vinyasa et en Hatha. Les séances HYROX sont présentées comme un défi accessible à tous les niveaux, du débutant à l'athlète confirmé.", "source": "https://biarritztraining.fr", "confiance": "haute", "note": "Rédigé d'après la page d'accueil du site officiel. Nom légal BIARRITZ TRAINING, enseigne « BESTRAINING BIARRITZ », 18 rue des Mésanges (annuaire des entreprises, SIREN 934672486). Tarifs et horaires non lus (pages Tarifs/Planning séparées)."}}, {"id": "description:biarritz-box", "kind": "textarea", "actors": [{"slug": "biarritz-box", "name": "BIARRITZ BOX"}], "current": "Aucune description", "placeholder": "Présentation de l’activité…", "suggest": {"value": "BIARRITZ BOX propose la location de boxes de self-stockage, du garde-meubles et de l'archivage, pour les particuliers, les professionnels et les surfeurs. Les boxes individuels fermés vont de 2 à 20 m², sans bail à signer, en location au mois. Le site est placé sous vidéosurveillance 24h/24 avec alarme, et dispose d'un stationnement gratuit, d'un quai de déchargement et de matériel de manutention en libre service. Pour les professionnels, l'entreprise assure des livraisons et enlèvements sur demande, et propose aussi des armoires de consigne pour le matériel de surf.", "source": "https://biarritz-box.com", "confiance": "haute", "note": ""}}, {"id": "description:biarritz-corp", "kind": "textarea", "actors": [{"slug": "biarritz-corp", "name": "BIARRITZ CORP"}], "current": "Conciergerie", "placeholder": "Présentation de l’activité…"}, {"id": "description:biarritz-domiciliation", "kind": "textarea", "actors": [{"slug": "biarritz-domiciliation", "name": "BIARRITZ DOMICILIATION"}], "current": "Création de boite aux lettres pour des entreprises", "placeholder": "Présentation de l’activité…", "suggest": {"value": "BIARRITZ DOMICILIATION propose un service de domiciliation à BIARRITZ pour les particuliers et les professionnels. Chaque client dispose d'une boîte aux lettres privative aux normes La Poste, dans un local fermé sous vidéosurveillance. L'équipe assure la réception et le renvoi du courrier ainsi que le retrait des recommandés et des colis spéciaux. Les bureaux sont ouverts du lundi au vendredi de 9h à 18h, et les boîtes sont accessibles 24h/24 et 7j/7.", "source": "http://www.biarritzdomiciliation.com", "confiance": "haute", "note": ""}}, {"id": "description:boucherie-diraty", "kind": "textarea", "actors": [{"slug": "boucherie-diraty", "name": "BOUCHERIE D'IRATY"}], "current": "Vente de viandes", "placeholder": "Présentation de l’activité…", "suggest": {"value": "La Boucherie d'Iraty est une boucherie charcuterie installée Halle DARLA, au 10 rue des Mésanges, au VILLAGE Iraty-BIARRITZ. Elle propose du porc, du bœuf, de l'agneau et de la volaille, dont de l'agneau des Pyrénées issu de la coopérative Amatik, du poulet Label Rouge et du jambon blanc Kintoa des Aldudes. Les viandes sont maturées 5 à 6 semaines sur carcasses entières, et la boutique propose aussi de la charcuterie pour l'apéritif. Elle fait également traiteur, avec des plats cuisinés comme la blanquette de veau ou le navarin d'agneau, ainsi que du foie gras, des daubes et des pâtés.", "source": "https://www.boucheriediraty.fr", "confiance": "haute", "note": ""}}, {"id": "description:boulangerie-enneartz", "kind": "textarea", "actors": [{"slug": "boulangerie-enneartz", "name": "BOULANGERIE ENNEARTZ"}], "current": "Boulangerie biologique", "placeholder": "Présentation de l’activité…", "suggest": {"value": "La Boulangerie Biologique ENNÉARTZ fabrique sur place des pains, viennoiseries et biscuits à partir de farines biologiques. Ses pains sont faits au levain naturel, fabriqué sur place et agréé Ecocert, avec une farine du Sud-Ouest (Occitanie) et une préférence pour la mouture sur meule de pierre. La gamme va du pain de campagne aux pains complets, semi-complets, aux céréales, au seigle, au petit épeautre et aux variétés anciennes. La boulangerie est installée au 6 rue des Mésanges, au VILLAGE Iraty-BIARRITZ.", "source": "https://web.archive.org/web/2024/https://www.boulangerie-enneartz.fr/ ; https://web.archive.org/web/20240725001240/https://www.boulangerie-enneartz.fr/pains ; https://fr.gaultmillau.com/fr/artisans/boulangerie-enneartz", "confiance": "haute", "note": "Site officiel indisponible (503) au 12/10/2026, contenu lu sur l'archive 2024. Gault&Millau confirme : pains au levain naturel, viennoiseries, biscuits, pains spéciaux (céréales, seigle, petit épeautre, complet, variétés anciennes)."}}, {"id": "description:bowl-go", "kind": "textarea", "actors": [{"slug": "bowl-go", "name": "BOWL & GO"}], "current": "Livraison de nourriture", "placeholder": "Présentation de l’activité…", "suggest": {"value": "BOWL & GO prépare des bols frais et équilibrés, des jus frais et des desserts healthy, à emporter ou en livraison. Tous les produits sont présentés comme frais, faits maison et préparés à la demande. La livraison fonctionne 7j/7, le midi de 11h30 à 14h30 et le soir de 18h30 à 22h, sans minimum de commande, à BIARRITZ, Anglet, Bidart, Bayonne, Bassussarry, Arbonne, Arcangues et Boucau. Les commandes peuvent aussi être retirées sur place, au 14 rue des Mésanges, dans la Halle DARLA du VILLAGE Iraty-BIARRITZ.", "source": "https://www.bowlandgo.fr", "confiance": "haute", "note": "Les horaires du site (11h30 à 14h30 et 18h30 à 22h, 7j/7) diffèrent de l'horaire actuel « Du lundi au dimanche 11H30 à 22H »."}}, {"id": "description:brasserie-diraty", "kind": "textarea", "actors": [{"slug": "brasserie-diraty", "name": "BRASSERIE D'IRATY"}], "current": "Brasserie", "placeholder": "Présentation de l’activité…", "suggest": {"value": "La BRASSERIE D'IRATY est une brasserie française installée au 16 rue des Mésanges, au VILLAGE Iraty à BIARRITZ. Elle propose une cuisine dans un cadre familial, avec une terrasse. Elle accueille les repas de groupe et les repas d'affaires.", "source": "https://www.118712.fr/professionnels/WkZVWVVUHwI", "confiance": "faible", "note": "Seule source : fiche annuaire 118712 (texte « Soyez les bienvenus dans notre brasserie française, où vous pourrez profiter d'un cadre familial »), pas de site ni de page sociale officielle trouvés. Cette même fiche liste aussi des prestations de coiffure/barbier, signe d'une fiche mélangée : à prendre avec prudence. Aucun site officiel trouvé (le 118712 affiche une icône Facebook mais l'URL n'est pas lisible, page en 403)."}}, {"id": "description:btm-biarritz-train-miniature", "kind": "textarea", "actors": [{"slug": "btm-biarritz-train-miniature", "name": "BTM BIARRITZ TRAINS MINIATURES"}], "current": "Vente de trains miniatures", "placeholder": "Présentation de l’activité…", "suggest": {"value": "BTM BIARRITZ TRAINS MINIATURES est une boutique de trains miniatures neufs et d'occasion. Les articles sont également proposés à la vente en ligne, avec expédition par Colissimo ou en point relais Mondial Relay. La boutique participe à des expositions et bourses tout au long de l'année et propose un service de réparation et de digitalisation.", "source": "https://btm.eus", "confiance": "haute", "note": "Réparation/digitalisation mentionnée comme stand sur salon (FEDE RAIL). Le vendredi et le samedi, accueil sur rendez-vous selon le site."}}, {"id": "description:cabinet-de-radiologie-dr-nomblot", "kind": "textarea", "actors": [{"slug": "cabinet-de-radiologie-dr-nomblot", "name": "CABINET DE RADIOLOGIE DR.NOMBLOT"}], "current": "Centre d’imagerie médicale", "placeholder": "Présentation de l’activité…"}, {"id": "description:cap-vital-sante", "kind": "textarea", "actors": [{"slug": "cap-vital-sante", "name": "CAP VITAL SANTE"}], "current": "Vente de matériels medicaux", "placeholder": "Présentation de l’activité…", "suggest": {"value": "CAP VITAL SANTÉ est un magasin de matériel médical spécialisé dans le maintien à domicile et l'autonomie, qui accompagne particuliers et professionnels. Le magasin de BIARRITZ, installé au VILLAGE Iraty-BIARRITZ, propose des équipements de mobilité, des solutions pour l'hygiène et la salle de bain, des fauteuils de confort, des barres de maintien ou des coussins anti-escarres, ainsi qu'un service après-vente. L'enseigne propose une visite gratuite à domicile pour évaluer les besoins, avec devis gratuit et sans engagement, et la livraison à domicile sous conditions. Elle compte aussi des magasins à Saint-Paul-Lès-Dax et Capbreton.", "source": "https://capvitalsante64-40.fr/magasin-materiel-medical-biarritz-cap-vital/ ; https://capvitalsante64-40.fr/presentation-cap-vital-3-magasins-aquitaine/", "confiance": "haute", "note": "Le site parle d'un « magasin historique de Biarritz, qui a ouvert ses portes il y a plus de 20 ans » : non repris faute de date précise."}}, {"id": "description:carrosserie-jmb-auto-moto", "kind": "textarea", "actors": [{"slug": "carrosserie-jmb-auto-moto", "name": "CARROSSERIE JMB AUTO MOTO"}], "current": "Carrosserie de voitures motos", "placeholder": "Présentation de l’activité…", "suggest": {"value": "JMB AUTO MOTO est une carrosserie automobile et moto installée allée du Moura, dans le bâtiment BIARRITZ Activités du VILLAGE Iraty-BIARRITZ. L'atelier traite le débosselage, le redressage de pièces et la réparation après sinistre, ainsi que la restauration de véhicules modernes, anciens et de compétition. Pour les motos, il propose le passage au marbre, le contrôle de cadre et la réparation de réservoirs et de carénages. Il réalise aussi des peintures personnalisées ou à la teinte d'origine, de la soudure acier, aluminium et inox, la réparation de pièces plastiques et le remplacement de pare-brise.", "source": "http://www.carrosserie-biarritz.com", "confiance": "haute", "note": ""}}, {"id": "description:click-go", "kind": "textarea", "actors": [{"slug": "click-go", "name": "CLICK & GO"}], "current": "Livraison à domicile de course", "placeholder": "Présentation de l’activité…", "suggest": {"value": "CLICK & GO est un réseau d'épiciers locaux qui livre les courses à domicile, de nuit. Le service annonce une livraison en 20 minutes environ. Il dessert Bayonne, Anglet, BIARRITZ et les alentours.", "source": "https://www.clickgo.fr/vendeur/bayonne", "confiance": "haute", "note": ""}}, {"id": "description:depann-pc64", "kind": "textarea", "actors": [{"slug": "depann-pc64", "name": "DEPANN PC'64"}], "current": "Réparation de portables, ordinateur, connecteur ..", "placeholder": "Présentation de l’activité…", "suggest": {"value": "DEPANN PC'64 est un atelier de réparation informatique installé Halle DARLA, au 14 rue des Mésanges, à BIARRITZ. Il répare les smartphones et iPhone (écrans, batteries, boutons, caméras, connecteurs de charge, vitres arrière), les MacBook, les iMac et les PC portables. L'atelier intervient aussi sur les batteries de vélos et de trottinettes et sur le petit électroménager. Il vend des PC et des Mac, monte des PC gamer sur mesure, crée des sites web et se déplace à domicile sur rendez-vous. Un devis est établi avant chaque intervention et les réparations sont garanties de 3 mois à 1 an.", "source": "https://www.depannpc64.com", "confiance": "haute", "note": ""}}, {"id": "description:dietplus", "kind": "textarea", "actors": [{"slug": "dietplus", "name": "DIETPLUS"}], "current": "Conseil en nutrition", "placeholder": "Présentation de l’activité…", "suggest": {"value": "Le centre DIETPLUS de BIARRITZ, installé au VILLAGE Iraty-BIARRITZ, propose un accompagnement au rééquilibrage alimentaire et à la perte de poids avec un coach. La méthode commence par un bilan offert, suivi d'un accompagnement hebdomadaire personnalisé. Elle s'appuie aussi sur des produits de la marque, répartis en trois gammes : Active (perte de poids), Vitality (bien-être) et Life (solutions pratiques). Le réseau met en avant le plaisir de manger différemment, sans frustration ni contrainte.", "source": "https://www.dietplus.fr/ ; https://www.dietplus.fr/centres/biarritz", "confiance": "haute", "note": "La page du centre de BIARRITZ ne contient aucun texte de présentation propre : description rédigée à partir de la présentation nationale de la méthode Dietplus. La page centre affiche le nom « Henda Turki » sans intitulé de fonction : non repris."}}, {"id": "description:don-donuts", "kind": "textarea", "actors": [{"slug": "don-donuts", "name": "DON DONUTS"}], "current": "Boutique de donuts", "placeholder": "Présentation de l’activité…"}, {"id": "description:eat-go", "kind": "textarea", "actors": [{"slug": "eat-go", "name": "EAT & GO"}], "current": "Vente et livraison de nourriture", "placeholder": "Présentation de l’activité…"}, {"id": "description:eyesea-production", "kind": "textarea", "actors": [{"slug": "eyesea-production", "name": "EYESEA PRODUCTION"}], "current": "Production de films", "placeholder": "Présentation de l’activité…", "suggest": {"value": "Depuis 2010, EyeSea Production est une agence de création visuelle, audiovisuelle et cinématographique au Pays basque, installée au 25 allée du Moura à BIARRITZ. Elle met ses compétences créatives et éditoriales au service des entreprises et des institutions publiques pour leur communication visuelle et audiovisuelle, et produit des projets pour la télévision, le cinéma et les plateformes numériques. Ses prestations couvrent l'écriture et la gestion de projet, le tournage et la direction artistique, la post-production et le mixage, ainsi que la diffusion et le conseil. Elle réalise aussi de la photographie, du motion design, des images aériennes par drone, du livestreaming et des formations.", "source": "http://eyeseaproduction.com/index.php/services", "confiance": "haute", "note": "Aussi lu sur http://eyeseaproduction.com/. Aucun horaire publié sur le site."}}, {"id": "description:formatext", "kind": "textarea", "actors": [{"slug": "formatext", "name": "FORMATEXT"}], "current": "Propose des solutions de formations pour des entreprises", "placeholder": "Présentation de l’activité…", "suggest": {"value": "FORMATEXT accompagne les TPE et PME en informatique de gestion, gestion sociale et suivi de gestion. L'entreprise assure la vente, l'installation, le paramétrage et la formation sur les logiciels de paye, de comptabilité et de gestion commerciale (Sage, EBP, Ciel), dont elle est partenaire agréé ou revendeur. Elle réalise aussi, en externalisé ou sur site, les bulletins de salaire et les déclarations sociales, et aide à la mise en conformité sociale des entreprises. Elle met en place des tableaux de bord de suivi d'activité et de trésorerie.", "source": "https://web.archive.org/web/20190719043838/http://www.formatext-igs.com/nos-services/ ; https://web.archive.org/web/20190719052703/http://www.formatext-igs.com/notre-societe/", "confiance": "faible", "note": "Seule source : le site officiel archivé en 2019, le site actuel étant hors service et compromis. Contenu à faire valider par l'entreprise (activités et partenariats éditeurs possiblement datés). Zone d'intervention indiquée en 2019 : départements 64, 40, 65, 32, 47."}}, {"id": "description:kafe-etxea", "kind": "textarea", "actors": [{"slug": "kafe-etxea", "name": "KAFE ETXEA"}], "current": "Café restauration", "placeholder": "Présentation de l’activité…"}, {"id": "description:kines-biarritz-iraty", "kind": "textarea", "actors": [{"slug": "kines-biarritz-iraty", "name": "KINÉS BIARRITZ-IRATY"}], "current": "Aucune description", "placeholder": "Présentation de l’activité…"}, {"id": "description:larty-chaud", "kind": "textarea", "actors": [{"slug": "larty-chaud", "name": "L'ARTY CHAUD"}], "current": "Cuisine de bistro", "placeholder": "Présentation de l’activité…", "suggest": {"value": "L'Arty Chaud est un restaurant du quartier d'Iraty, installé Halle DARLA au 16 rue des Mésanges à BIARRITZ. Chaque midi, du lundi au samedi, il sert un menu de la semaine composé à partir des produits du marché et renouvelé chaque semaine, dans une ambiance conviviale inspirée des caves à vin. Le soir, il ouvre sur réservation pour les groupes d'au moins 10 personnes. L'Arty Chaud propose aussi un service traiteur bistronomique pour les événements privés et professionnels (cocktails, buffets, repas assis ou plateaux-repas) ainsi qu'une prestation de chef à domicile.", "source": "https://restaurant-larty-chaud.fr/", "confiance": "haute", "note": "Sources : pages accueil, contact et https://restaurant-larty-chaud.fr/traiteur-sur-biarritz/ du site officiel. La page chef à domicile n'est vue que comme entrée de menu. Le nom du chef (Simon Carliez, ex-Hôtel du Palais) n'apparaît que sur le Petit Futé, pas sur le site : volontairement non repris."}}, {"id": "description:la-ptite-biarrote", "kind": "textarea", "actors": [{"slug": "la-ptite-biarrote", "name": "LA PTITE BIARROTE"}], "current": "Restaurant", "placeholder": "Présentation de l’activité…", "suggest": {"value": "LA PTITE BIARROTE est un établissement de brunch et un traiteur installé au 14 rue des Mésanges, au VILLAGE Iraty-BIARRITZ. Pour les mariages, elle propose un buffet de brunch du lendemain, sucré et salé. Au menu : pancakes, brioches perdues, œufs brouillés, plateaux apéritifs salés ou sucrés, fruits frais, charcuteries et fromages, à base de produits frais faits maison.", "source": "https://www.mariages.net/food-truck/la-ptite-biarrote--e270719", "confiance": "faible", "note": "Sources tierces uniquement (mariages.net pour le contenu, guide-du-paysbasque.com pour les catégories brunch et traiteur) : aucun site ni réseau officiel trouvé. Le code NAF Sirene est 56.10C (restauration rapide)."}}, {"id": "description:lazy-days", "kind": "textarea", "actors": [{"slug": "lazy-days", "name": "LAZY DAYS"}], "current": "Salon de détente", "placeholder": "Présentation de l’activité…", "suggest": {"value": "LAZY DAYS est un institut de bien-être installé Halle DALBA, au 6 rue des Mésanges, au VILLAGE Iraty-BIARRITZ. Il se présente comme un lieu de déconnexion qui associe flottaison, massages sur mesure, soins du corps et du visage et un corner beauté. Les massages vont du massage relaxant ou drainant au massage sportif, femme enceinte, enfant ou cr-nien, avec des formules pour surfeurs et golfeurs. Des formules combinent flottaison et massage, et des bons cadeaux sont proposés.", "source": "https://www.massage-spa-biarritz.com", "confiance": "haute", "note": "Horaires du site : « Mardi au Samedi de 9H30 à 18H* (pause possible entre 12h et 14h, appelez avant de venir) »."}}, {"id": "description:le-local", "kind": "textarea", "actors": [{"slug": "le-local", "name": "LE LOCAL"}], "current": "Club de musique", "placeholder": "Présentation de l’activité…"}, {"id": "description:dr-leslie-morales", "kind": "textarea", "actors": [{"slug": "dr-leslie-morales", "name": "LESLIE MORALES OSTHÉOPATHE"}], "current": "Médecin Ostéopathe", "placeholder": "Présentation de l’activité…"}, {"id": "description:mega-sun-biarritz", "kind": "textarea", "actors": [{"slug": "mega-sun-biarritz", "name": "MEGASUN BIARRITZ"}], "current": "Centre de bronzage", "placeholder": "Présentation de l’activité…", "suggest": {"value": "MEGASUN BIARRITZ est un centre de bronzage en cabine UV installé dans la Halle DARLA, au VILLAGE Iraty-BIARRITZ. Le centre est équipé de solariums certifiés conformes à la réglementation, et un diagnostic de peau permet d'établir un programme de bronzage personnalisé. Les cabines disposent d'un brumisateur d'eau fraîche, d'un diffuseur d'arôme, d'une prise pour lecteur MP3 et de la climatisation. Le centre accueille sans rendez-vous et propose aussi le blanchiment des dents. Les séances sont interdites aux moins de 18 ans et le port de lunettes de protection est obligatoire.", "source": "https://www.megasun-biarritz.fr/", "confiance": "haute", "note": ""}}, {"id": "description:monsieur-brisson", "kind": "textarea", "actors": [{"slug": "monsieur-brisson", "name": "MONSIEUR BRISSON"}], "current": "Politique", "placeholder": "Présentation de l’activité…", "suggest": {"value": "Max Brisson est sénateur des Pyrénées-Atlantiques depuis 2017. Sa permanence parlementaire est installée au bâtiment Les Aldades, au VILLAGE Iraty à BIARRITZ. Au Sénat, il est vice-président de la commission de la culture, de l'éducation, de la communication et du sport, et coordonnateur du groupe Les Républicains au sein de cette commission. Il est également membre de la délégation sénatoriale aux collectivités territoriales et à la décentralisation, et conseiller départemental des Pyrénées-Atlantiques.", "source": "https://www.maxbrisson.fr/", "confiance": "haute", "note": "Rédigé uniquement à partir de la page d'accueil de maxbrisson.fr (« Votre sénateur de terrain »)."}}, {"id": "description:nahia", "kind": "textarea", "actors": [{"slug": "nahia", "name": "NAHIA"}], "current": "Restaurant", "placeholder": "Présentation de l’activité…"}, {"id": "description:number-one-shop", "kind": "textarea", "actors": [{"slug": "number-one-shop", "name": "NUMBER ONE BARBERSHOP"}], "current": "Barbier", "placeholder": "Présentation de l’activité…", "suggest": {"value": "NUMBER ONE BARBERSHOP est un salon de barbier installé Halle DARLA, rue des Mésanges, au VILLAGE Iraty-BIARRITZ. Il propose des coupes pour hommes, adolescents, étudiants et enfants jusqu'à 15 ans, une formule père et fils, ainsi que la taille et l'entretien de la barbe. Le salon met en avant un toilettage masculin qui mêle tradition et modernité. Les rendez-vous se prennent en ligne sur Planity, et une boutique en ligne propose des produits.", "source": "https://www.numberonebarbershop.com ; https://www.planity.com/number-one-barbershop-64200-biarritz-kui", "confiance": "haute", "note": "Sur le site officiel, l'email affiché (direction@) diffère du lien mailto (natanael@numberonebarbershop.com)."}}, {"id": "description:ongles-en-gel", "kind": "textarea", "actors": [{"slug": "ongles-en-gel", "name": "ONGLES EN GEL"}], "current": "Prothésiste ongulaire", "placeholder": "Présentation de l’activité…", "suggest": {"value": "ONGLES EN GEL 64 est un salon de prothésie ongulaire installé au VILLAGE Iraty-BIARRITZ. Il propose la pose d'ongles en gel et en acrylique, les extensions, le remplissage et le vernis, ainsi que le nail art. Le salon réalise aussi des manucures, dont la manucure russe, et des soins des mains et des pieds pour femmes et hommes. Les rendez-vous se prennent en ligne ou par téléphone.", "source": "https://www.fresha.com/lvp/ongles-en-gel64-biarritz-rue-des-mesanges-biarritz-RrV636", "confiance": "faible", "note": "Rédigée à partir de la seule liste de prestations Fresha (Acrylic Nails, Dip Powder Nails, Gel Nail Extensions, Gel Nails, Manicure, Manicure and Pedicure, Men's Manicure, Men's Pedicure, Nail Art, Nail Extensions, Nail Polish, Russian Manicure) ; pas de texte de présentation trouvé."}}, {"id": "description:origins-digital", "kind": "textarea", "actors": [{"slug": "origins-digital", "name": "ORIGINS DIGITAL"}], "current": "Vente de matériels digitales", "placeholder": "Présentation de l’activité…", "suggest": {"value": "ORIGINS DIGITAL conçoit des solutions numériques pour les organisations sportives : diffuseurs, ligues, fédérations et clubs. Sa plateforme OTT permet de diffuser des contenus en direct et à la demande, avec abonnements, paiement à l'acte et insertion publicitaire. L'entreprise propose aussi un lecteur vidéo enrichi, un Data Hub qui centralise les données des fournisseurs et un générateur automatique de faits de match. Elle est née du rapprochement de Netco Sports et de la start-up biarrote On Rewind, qui opèrent sous le nom Origins Digital.", "source": "https://www.origins-digital.com/", "confiance": "haute", "note": "Dernière phrase sourcée par https://www.svgeurope.org/blog/headlines/netco-sports-and-on-rewind-become-origins-digital/?print=1 (fusion On Rewind / Netco Sports). La description actuelle « Vente de matériels digitales » est inexacte : c'est un éditeur de logiciels / plateformes vidéo (NAF 62.01Z)."}}, {"id": "description:pharmacie-biarritz-iraty", "kind": "textarea", "actors": [{"slug": "pharmacie-biarritz-iraty", "name": "PHARMACIE BIARRITZ IRATY"}], "current": "Pharmacie vente de produits de santé", "placeholder": "Présentation de l’activité…", "suggest": {"value": "La PHARMACIE BIARRITZ IRATY se présente comme un espace de santé, de conseils et de services pour toute la famille. Elle loue et vend du matériel médical d'aide à la mobilité (fauteuils roulants, cannes, déambulateurs) et du matériel d'aide à la vie courante, comme des fauteuils de repos. Elle propose une gamme de matériel orthopédique : colliers cervicaux, attelles, orthèses. Sa parapharmacie de plus de 200 m² réunit un large choix de marques, dont des marques locales et bio. Elle assure la livraison à domicile du matériel médical et de l'oxygène.", "source": "https://www.pharmacie-biarritz-iraty.fr", "confiance": "haute", "note": ""}}, {"id": "description:piuma-pizza", "kind": "textarea", "actors": [{"slug": "piuma-pizza", "name": "PIUMA PIZZA"}], "current": "Vente de pizza", "placeholder": "Présentation de l’activité…", "suggest": {"value": "PIUMA est une petite pizzeria artisanale qui prépare des pizzas de style napolitain. La pâte est faite maison à partir de farine de blé, d'eau, de sel et de levure. Les garnitures associent des légumes frais, bio et locaux à de la charcuterie d'Italie ou du Pays Basque, et la mozzarella fior di latte est taillée chaque jour. Les pizzas sont cuites rapidement à haute température.", "source": "https://piumabiarritz.com", "confiance": "haute", "note": ""}}, {"id": "description:pog-64", "kind": "textarea", "actors": [{"slug": "pog-64", "name": "POG64"}], "current": "Concept de cuisines", "placeholder": "Présentation de l’activité…", "suggest": {"value": "POG 64 est un showroom de cuisines installé dans les Halles d'Iraty, 16 rue des Mésanges à BIARRITZ, sous l'enseigne Concept Store Cuisines. Revendeur agréé de marques européennes dont Poggenpohl, Tomasella et Arredo3, il expose sur 120 m² les nouveautés de l'aménagement intérieur. L'équipe conçoit et réalise des cuisines, des salles de bain et des dressings, de la conception à l'installation finale. Elle intervient sur la Côte basque et dans les Landes.", "source": "https://cuisinesbiarritz.com/", "confiance": "haute", "note": "Lien POG 64 = Concept Store Cuisines établi par le même téléphone (05 59 51 00 19) et la même adresse que la fiche Poggenpohl de SARL POG 64. Le site du showroom, https://cuisinesbiarritz.com/, serait un meilleur lien que poggenpohl.com/fr (non demandé). Un annuaire cite 130 m², le site officiel dit 120 m² : c'est ce dernier qui est repris."}}, {"id": "description:regatta-france", "kind": "textarea", "actors": [{"slug": "regatta-france", "name": "REGATTA FRANCE"}], "current": "Vente des produits pour la randonnée, montagne", "placeholder": "Présentation de l’activité…", "suggest": {"value": "REGATTA FRANCE est une société de commerce d'habillement dont un établissement est installé au 25 allée du Moura, à BIARRITZ. Elle porte le nom de Regatta, entreprise familiale fondée par Lionel Black et basée à Trafford Park, à Manchester, qui conçoit des vêtements outdoor. La marque propose notamment des vestes imperméables et des chaussures de marche, et a lancé la marque de ski Dare2b.", "source": "https://regatta.com/about-us/", "confiance": "faible", "note": "Faits sur la marque lus sur regatta.com/about-us et regatta.com/fr ; adresse et activité lues dans SIRENE (https://annuaire-entreprises.data.gouv.fr/entreprise/414252312). Le lien entre REGATTA FRANCE et le groupe britannique n'est écrit nulle part explicitement (seul indice : le gérant SIRENE est Keith Black, que regatta.com présente comme CEO). La nature de l'établissement de BIARRITZ (bureau, showroom, boutique) n'est précisée par aucune source."}}, {"id": "description:sud-immo-pro", "kind": "textarea", "actors": [{"slug": "sud-immo-pro", "name": "SUD IMMO PRO"}], "current": "Aménageur et Constructeur", "placeholder": "Présentation de l’activité…", "suggest": {"value": "SUD IMMO PRO est un aménageur et constructeur d'espaces commerciaux et professionnels, installé au VILLAGE Iraty-BIARRITZ. La société a réalisé à BIARRITZ la Halle DARLA, la Halle OCCABÉ, le bâtiment BIARRITZ Activités, Les ALDADES et la Halle DALBA, qui accueillent commerces, artisans, services, entreprises et un pôle santé. Elle a également mené des programmes hors de BIARRITZ, comme DUNES et son pôle santé à Capbreton et XYLEM dans la zone d'activité Magellan à Pessac.", "source": "https://www.sud-immo-pro.com/", "confiance": "haute", "note": ""}}, {"id": "description:sunset-studio-biarritz", "kind": "textarea", "actors": [{"slug": "sunset-studio-biarritz", "name": "SUNSET STUDIO BIARRITZ"}], "current": "Location de studio photo", "placeholder": "Présentation de l’activité…", "suggest": {"value": "SUNSET STUDIO BIARRITZ loue un studio photo tout équipé, installé Halle DARLA au VILLAGE Iraty à BIARRITZ. Le studio offre 50 m² avec un recul de 6 m. Chaque location inclut le matériel : six rouleaux de fond de couleur dont un noir et un blanc, torches vidéo LED, flashs de studio, softbox, parapluie, pieds, déclencheur radio et flashmètre. La location se réserve en ligne à la demi-journée (4 heures) ou à la journée (8 heures).", "source": "https://sunset-studio.fr/v2/", "confiance": "haute", "note": "Texte tiré de la description du studio sur la page de réservation officielle (marques du matériel : Godox, Sekonic)."}}, {"id": "description:the-inspire-academy", "kind": "textarea", "actors": [{"slug": "the-inspire-academy", "name": "THE INSPIRE ACADEMY"}], "current": "Formation linguistique", "placeholder": "Présentation de l’activité…", "suggest": {"value": "THE INSPIRE ACADEMY est une école de langues installée à BIARRITZ. Elle propose des cours de français, d'anglais, d'espagnol, de basque, d'italien, d'allemand, d'arabe, de chinois, de portugais et de russe, en présentiel ou en ligne, avec un accompagnement personnalisé. L'école organise aussi des séjours linguistiques et des stages d'immersion en français, et prépare aux certifications TOEIC, DCL et CLOE. Les formations peuvent être financées par le CPF, les OPCO ou France Travail.", "source": "https://inspireacademy.fr", "confiance": "haute", "note": "Le site écrit « Pôle emploi » ; remplacé par France Travail, à vérifier si l'on préfère citer le libellé du site."}}, {"id": "description:umih-pays-basque", "kind": "textarea", "actors": [{"slug": "umih-pays-basque", "name": "UMIH PAYS BASQUE"}], "current": "Accompagne au quotidien de nombreuses entreprises", "placeholder": "Présentation de l’activité…"}, {"id": "description:veloff", "kind": "textarea", "actors": [{"slug": "veloff", "name": "VELOFF"}], "current": "Vente de cafés", "placeholder": "Présentation de l’activité…", "suggest": {"value": "VELOFF est un coffee shop doublé d'un atelier vélo, ouvert en octobre 2020 au VILLAGE Iraty-BIARRITZ, dans la Halle DARLA. Le café sert, du petit-déjeuner au goûter, une cuisine maison préparée sur place : pâtisseries, plat du jour, croques et grilled-cheese, avec des produits de saison. À l'étage, l'atelier répare et entretient les vélos, loue des vélos de route haut de gamme en carbone et vend du textile et des accessoires pour cyclistes. VELOFF propose aussi des sorties à vélo encadrées par une accompagnatrice diplômée pour découvrir le Pays Basque.", "source": "https://www.veloffcafe.fr/", "confiance": "haute", "note": ""}}, {"id": "description:nouvelle-compagnie-des-arts-graphiques", "kind": "textarea", "actors": [{"slug": "nouvelle-compagnie-des-arts-graphiques", "name": "NOUVELLE COMPAGNIE DES ARTS GRAPHIQUES"}], "current": "Original Prints and Posters | Mucha Warhol Dali Miro Chagall | Quality rarety authenticity 19th & 20th Century we ship worldwide", "placeholder": "Présentation de l’activité…", "suggest": {"value": "La Nouvelle Compagnie des Arts Graphiques (NCAG) est une galerie spécialisée depuis 2001 dans les estampes originales rares et les œuvres sur papier des XIXe et XXe siècles. Son fonds réunit des maîtres de l'Art nouveau et de l'affiche (Alphonse Mucha, Théophile-Alexandre Steinlen), des artistes modernes (Picasso, Chagall, Miró, Giacometti) et du Pop Art (Andy Warhol, Roy Lichtenstein, Robert Indiana). La galerie ne vend que des œuvres originales, dont elle garantit l'authenticité, l'époque et l'originalité, et délivre un certificat d'authenticité. Elle expédie dans le monde entier en livraison assurée depuis la Halle DARLA, au VILLAGE Iraty-BIARRITZ.", "source": "https://www.ncag-art-gallery.com", "confiance": "haute", "note": "D'après la page d'accueil du site (en anglais). Le site écrit « T. A. Steinlen » : le prénom complet est développé ici, à réduire à « Steinlen » si on veut s'en tenir à la lettre. Dalí, cité dans la description actuelle, n'apparaît pas dans ce que j'ai lu. ÉCARTS relevés sans avoir été demandés : le site donne le téléphone +33 6 86 06 38 22 (connu : 07 85 56 62 52) et l'adresse « Halle DARLA Lot 33 R+1 » ; l'annuaire des entreprises (SIREN 802731026) indique « HALLE DARLA LOT 30 »."}}]}, {"id": "verifier", "title": "Fiches à relire entièrement", "intro": "Aucun formulaire n’a été reçu pour ces acteurs, dont les 4 nouveaux ajoutés le 15 octobre (ALOHA, Bloc Session, Gaïa Destockage, Jet Records) : en dehors de l’adresse que vous nous avez donnée, leurs informations viennent de leur site internet. Relisez-les et indiquez ce qui est faux.", "items": [{"id": "verifier:bye-buy-car", "kind": "review", "actors": [{"slug": "bye-buy-car", "name": "BYE BUY CAR"}], "facts": [["Adresse", "27 Allée du Moura, 64200 BIARRITZ"], ["Téléphone", "05 59 24 60 21"], ["Site", "https://bye-buy-car.com"], ["Horaires", "Mar-Ven : 10h-13h / 14h-18h30 · Sam : 10h-13h / 14h-17h"], ["Description", "L'agence automobile Bye Buy Car vous accompagne dans la vente ou l'achat de votre voiture d'occasion. Une équipe d'experts à votre disposition pour faciliter vos démarches."]], "suggest": {"value": "Adresse 27 allée du Moura : CONFIRMÉE (site officiel). Site https://bye-buy-car.com : CONFIRMÉ (BIARRITZ figure dans la liste des agences). Téléphone 05 59 24 60 21 : INTROUVABLE (aucune source, le champ téléphone de l'agence est vide sur le site officiel ; seul numéro publié = mobile de l'agent, 06 79 73 47 41). Horaires « Mar-Ven : 10h-13h / 14h-18h30 · Sam : 10h-13h / 14h-17h » : INTROUVABLES (aucune source ; PagesJaunes n'a aucune fiche Bye Buy Car à BIARRITZ). Au passage, le format des horaires n'est pas celui du site (« Du mardi au vendredi de 10h à 13h et de 14h à 18h30 · Samedi de 10h à 13h et de 14h à 17h »).", "source": "https://api.bye-buy-car.com/api/get-staff-by-cp/64200", "confiance": "haute", "note": ""}}, {"id": "verifier:clairement-sucre", "kind": "review", "actors": [{"slug": "clairement-sucre", "name": "CLAIREMENT SUCRÉ"}], "facts": [["Téléphone", "06 18 29 79 46"], ["Email", "claire.bldn@gmail.com"], ["Site", "https://www.clairement-sucre.fr"], ["Description", "Pâtisserie artisanale sur commande.\nNée d'une reconversion professionnelle et d'une formation en pâtisserie, CLAIREMENT SUCRÉ propose des douceurs où l'élégance rencontre la gourmandise, entre tradition et modernité, avec des ingrédients choisis au fil des saisons.\nÀ la carte :\n• Saint-Honoré chocolat & vanille\n• Tarte noisette, poire & chocolat\n• Pavlova agrumes\n• Tarte citron, romarin & sésame noir\n• Cookie cacahuète & caramel beurre salé\nGrandes pâtisseries de 4 à 12 parts, sur commande.\nAtelier de création, sans boutique ouverte au public : les commandes se passent en ligne sur le site ou par WhatsApp."]], "suggest": {"value": "Téléphone 06 18 29 79 46 : CONFIRMÉ (Guide du Pays Basque, fiche Clairement Sucré). Email claire.bldn@gmail.com : INTROUVABLE sur une source publique (ni confirmé ni infirmé). Site https://www.clairement-sucre.fr : HORS LIGNE, le nom de domaine ne résout plus ; whois au 12/10/2026 : expiré le 01/10/2026, statut REDEMPTION / pendingDelete. Ne plus afficher ce lien sauf renouvellement par la cliente. Alternative officielle : Instagram https://www.instagram.com/clairementsucre/ (profil « Claire Blandin Pâtisserie (@clairementsucre) », lien donné par le Guide du Pays Basque).", "source": "https://www.guide-du-paysbasque.com/fr/adresses-utiles/alimentation/boulangeries-patisseries/bidart-54/clairement-sucre-9000.html ; whois clairement-sucre.fr ; https://www.instagram.com/clairementsucre/", "confiance": "haute", "note": "La fiche du Guide du Pays Basque date de l'époque de Bidart (8 impasse Burruntz, vente de cookies sur les marchés de Quintaou et de Bidart) : périmée pour l'adresse. Aucun horaire publié trouvé, cohérent avec une activité sur commande const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

const SUGGESTABLE = ['text', 'textarea', 'address'];
function isDone(item) {
  const a = answers[item.id] || {};
  if (a.none) return true;
  if (a.by === 'auto' && a.confirm === false) return false;   // pré-rempli mais incomplet (ex. adresse sans lot)
  const sg = item.suggest;
  if (sg && SUGGESTABLE.includes(item.kind)) {
    if (a.confirm) return true;
    if (item.kind === 'address') {
      const r = (a.rue || '').trim(), l = (a.lot || '').trim();
      return !!(r || l) && (r !== (sg.rue || '') || l !== (sg.lot || ''));
    }
    const v = (a.value || '').trim();
    return !!v && v !== sg.value.trim();
  }
  switch (item.kind) {
    case 'choice': return a.choice === '__autre' ? !!(a.other || '').trim() : !!a.choice;
    case 'address': return !!((a.rue || '').trim() || (a.lot || '').trim());
    case 'review': return a.ok === 'ok' || (a.ok === 'ko' && !!(a.note || '').trim());
    default: return !!(a.value || '').trim();
  }
}

function actorHead(item) {
  return item.actors.map(a => `<h3><span class="check" aria-hidden="true"></span>${esc(a.name)}</h3>
    <a href="/acteur/${esc(a.slug)}" target="_blank" rel="noopener">Voir la fiche en ligne ↗</a>`).join('');
}

const isPending = item => (!!item.suggest || (answers[item.id] || {}).by === 'auto') && !isDone(item) && item.kind !== 'review';
function host(u) { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return u || ''; } }
function sugBox(item, withConfirm) {
  const sg = item.suggest; if (!sg) return '';
  const val = sg.answer || (item.kind === 'review' ? sg.value : '');
  return `<div class="sug"><span class="tag">${item.kind === 'choice' ? 'Réponse trouvée en ligne' : 'Trouvé en ligne'}, à vérifier${sg.confiance === 'faible' ? ' (source incertaine)' : ''}</span>
    ${val ? `<span class="val">${esc(val)}</span>` : ''}
    ${sg.source ? `<span>Source : <a href="${esc(sg.source)}" target="_blank" rel="noopener">${esc(host(sg.source))}</a></span>` : ''}
    ${sg.note ? `<span>${esc(sg.note)}</span>` : ''}</div>
    ${withConfirm ? `<label class="none"><input type="checkbox" data-k="confirm"> C’est correct</label>` : ''}`;
}

function noneBox(item) {
  return `<label class="none"><input type="checkbox" data-k="none"> Pas d’information disponible</label>`;
}

function renderItem(item) {
  const id = esc(item.id), uid = 'f-' + item.id.replace(/[^a-z0-9]/gi, '-');
  let left = `<div class="who">${actorHead(item)}`, right = '';
  if (item.kind === 'choice') {
    left = `<div class="who">${item.actors.length > 1
      ? `<h3><span class="check" aria-hidden="true"></span>${item.actors.length} acteurs concernés</h3><p class="current">${item.actors.map(a => esc(a.name)).join('\n')}</p>`
      : actorHead(item)}`;
    right = `<p class="question">${esc(item.question)}</p>${item.src ? `<p class="current">Source : <a href="${esc(item.src)}" target="_blank" rel="noopener">${esc(host(item.src))}</a></p>` : ''}${sugBox(item)}<div class="choices" role="radiogroup">` +
      item.options.map((o, i) => `<label class="choice"><input type="radio" name="${uid}" value="${esc(o)}" data-k="choice"> <span>${esc(o)}</span></label>`).join('') +
      (item.other ? `<label class="choice"><input type="radio" name="${uid}" value="__autre" data-k="choice"> <span>Autre réponse</span></label>
        <input type="text" data-k="other" aria-label="Autre réponse" placeholder="Précisez la bonne réponse">` : '') + '</div>';
  } else if (item.kind === 'address') {
    left += `<p class="current">Adresse actuelle :\n<b>${esc(item.current)}</b></p>`;
    right = `${sugBox(item, true)}<div class="pair">

    </div>${noneBox(item)}`;
  } else if (item.kind === 'review') {
    left += `<dl class="facts">${item.facts.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`;
    right = `${sugBox(item)}<div class="choices" role="radiogroup">
      <label class="choice"><input type="radio" name="${uid}" value="ok" data-k="ok"> <span>Tout est exact</span></label>

  } else {
    left += `<p class="current">${item.kind === 'textarea' ? 'Texte actuel :\n' : ''}<b>${esc(item.current)}</b></p>`;
    const tag = item.kind === 'textarea'
      ? `<textarea id="${uid}" data-k="value" placeholder="${esc(item.placeholder)}"></textarea>`
      : `<input type="${item.input === 'text' ? 'text' : item.input}" id="${uid}" data-k="value" placeholder="${esc(item.placeholder)}" autocomplete="off">`;
    right = `${sugBox(item, true)}<label class="lbl" for="${uid}">${item.kind === 'textarea' ? 'Nouveau texte' : 'Information à ajouter'}</label>${tag}${noneBox(item)}`;
  }
  return `<div class="item" data-id="${id}">${left}</div><div class="answer">${right}</div></div>`;
}

// Pré-remplit les champs avec les propositions trouvées en ligne, sans écraser une saisie existante.
function seed() {
  Object.values(itemById).forEach(item => {
    const sg = item.suggest; if (!sg || !SUGGESTABLE.includes(item.kind)) return;
    const a = answers[item.id] = answers[item.id] || {};
    if (item.kind === 'address') { if (!('rue' in a) && !('lot' in a)) { a.rue = sg.rue || ''; a.lot = sg.lot || ''; } }
    else if (!('value' in a)) a.value = sg.value;
  });
}

function autoNote(row, a) {}   // la provenance des réponses pré-remplies reste dans les données, sans affichage

function fill() {
  document.querySelectorAll('.item').forEach(row => {
    const a = answers[row.dataset.id] || {};
    autoNote(row, a);
    row.querySelectorAll('[data-k]').forEach(el => {
      const k = el.dataset.k;
      if (el.type === 'radio') el.checked = a[k] === el.value;
      else if (el.type === 'checkbox') el.checked = !!a[k];
      else el.value = a[k] || '';
    });
  });
  $('#comment').value = comment;
  refresh();
}

function refresh() {
  let total = 0, done = 0;
  DATA.sections.forEach(s => {
    const d = s.items.filter(isDone).length, pend = s.items.filter(isPending).length;
    total += s.items.length; done += d;
    const full = d === s.items.length;
    document.querySelectorAll(`[data-sum="${s.id}"], [data-meter="${s.id}"]`).forEach(el => {
      el.classList.toggle('done', full);
      el.querySelector('.count').innerHTML = full ? `Terminé (${d})` : `${d} sur ${s.items.length} traitées` + (pend ? ` · <span class="pend">${pend} à vérifier</span>` : '');
      const bar = el.querySelector('.bar i'); if (bar) bar.style.width = (100 * d / s.items.length) + '%';
    });
  });
  document.querySelectorAll('.item').forEach(row => {
    const item = itemById[row.dataset.id];
    const a = answers[item.id] || {};
    row.classList.toggle('is-done', isDone(item));
    row.classList.toggle('to-check', isPending(item));
    row.querySelectorAll('input:not([type=checkbox]):not([type=radio]), textarea').forEach(el => el.disabled = !!a.none);
    const other = row.querySelector('[data-k=other]'); if (other) other.disabled = a.choice !== '__autre';
  });
  $('#total').textContent = `${done} sur ${total} lignes traitées`;
}

function mergeAnswers(base, other) {
  const out = { ...base };
  Object.entries(other || {}).forEach(([id, a]) => {
    const cur = out[id];
    if (!a || !a.at) return;
    if (!cur || !cur.at || a.at > cur.at) out[id] = a;
  });
  return out;
}

function changed() {
  dirty = true; refresh();
  setStatus('Modifications non enregistrées');
  try { localStorage.setItem(LOCAL, JSON.stringify({ answers, comment, commentAt })); } catch (e) {}
  clearTimeout(timer); timer = setTimeout(save, 4000);
}

async function save() {
  clearTimeout(timer);
  if (saving || !dirty) { if (!dirty) setStatus($('#status').textContent || 'Rien à enregistrer'); return; }
  saving = true; $('#save').disabled = true; setStatus('Enregistrement…');
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
      body: JSON.stringify({ cle: KEY, v: CLIENT_VERSION, answers, comment, comment_at: commentAt }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.ok) throw new Error(j.error || 'Erreur ' + r.status);
    dirty = false; setStatus('Enregistré le ' + hhmm(new Date(j.saved_at)));
  } catch (e) {
    setStatus('Échec de l’enregistrement : ' + e.message + '. Vos réponses restent sur cet ordinateur, réessayez dans un instant.', true);
  } finally { saving = false; $('#save').disabled = false; }
}

function gate(msg, title) {
  $('#content').innerHTML = `<div class="gate"><h2>${title || 'Ce lien est incomplet'}</h2><p>${msg}</p></div>`;
}

const itemById = {};
DATA.sections.forEach(s => s.items.forEach(i => itemById[i.id] = i));

(async function start() {
  if (!KEY) return gate('Utilisez le lien complet qui vous a été transmis : il contient une clé d’accès après « ?cle= ».');
  let saved;
  try {
    const r = await fetch(API + '?cle=' + encodeURIComponent(KEY), { cache: 'no-store' });
    const j = await r.json().catch(() => ({}));
    if (r.status === 403) return gate('La clé d’accès de ce lien n’est pas reconnue. Vérifiez que le lien a été copié en entier.');
    if (!r.ok || !j.ok) throw new Error(j.error || 'Erreur ' + r.status);
    saved = j;
  } catch (e) {
    // Sans les réponses du serveur, on ne laisse rien saisir : un enregistrement partiel pourrait faire croire à une perte.
    return gate('Vos réponses enregistrées n’ont pas pu être chargées (' + esc(e.message) + '). Rien n’est perdu : rechargez la page dans un instant.', 'Chargement impossible');
  }
  const data = saved.data || {};
  answers = asObj(data.answers); comment = data.comment || ''; commentAt = data.comment_at || '';

  // Réponses restées sur cet ordinateur et plus récentes que celles du serveur : on les récupère.
  let local = null, recovered = 0;
  try { local = JSON.parse(localStorage.getItem(LOCAL) || 'null'); } catch (e) {}
  if (local && local.answers) {
    const merged = mergeAnswers(answers, asObj(local.answers));
    recovered = Object.keys(merged).filter(id => merged[id] !== answers[id]).length;
    answers = merged;
    if (local.commentAt && local.commentAt > commentAt) { comment = local.comment || ''; commentAt = local.commentAt; recovered++; }
  }
  seed(); render(); fill();
  $('#savebar').hidden = false;
  if (recovered) { dirty = true; setStatus(`${recovered} réponse${recovered > 1 ? 's' : ''} retrouvée${recovered > 1 ? 's' : ''} sur cet ordinateur, enregistrement…`); save(); }
  else if (saved.saved_at) setStatus('Dernier enregistrement le ' + hhmm(new Date(saved.saved_at)));
  else setStatus('Aucune réponse enregistrée pour l’instant');

  $('#content').addEventListener('input', onEdit);
  $('#content').addEventListener('change', onEdit);
  $('#save').addEventListener('click', () => { if (!dirty) { setStatus('Tout est déjà enregistré'); return; } save(); });
  window.addEventListener('beforeunload', e => { if (dirty) { save(); e.preventDefault(); e.returnValue = ''; } });
})();

function onEdit(e) {
  const el = e.target;
  if (el.id === 'comment') { comment = el.value; commentAt = new Date().toISOString(); return changed(); }
  const row = el.closest('.item'); if (!row || !el.dataset.k) return;
  const a = answers[row.dataset.id] = { ...(answers[row.dataset.id] || {}) };
  if (el.type === 'checkbox') a[el.dataset.k] = el.checked;
  else if (el.type === 'radio') { if (el.checked) a[el.dataset.k] = el.value; }
  else a[el.dataset.k] = el.value;
  a.at = new Date().toISOString();
  if (a.by === 'auto') { delete a.by; delete a.src; delete a.src_url; autoNote(row, a); }
  changed();
}
</script>
